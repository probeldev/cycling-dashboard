{{ template "head" . }}
<style>
  /* ===== страница графиков тренировки ===== */
  {{ template "workoutBaseStyles" . }}
</style>

<div class="w-layout">
{{ template "workoutNav" . }}
<div class="w-content">

<header class="w-head">
  <a class="w-back" href="/rides">← Поездки</a>
  <h1>{{ datetime .W.StartTime }}{{ if .W.Name }} <span class="w-name">· {{ .W.Name }}</span>{{ end }}</h1>
</header>

<section id="charts">
  <h2 class="sec-h">Графики</h2>
  <div id="chartCtl" class="chart-controls">
    <span id="metricBtns" class="tabs"></span>
    <span id="axisBtns" class="axis-toggles"></span>
  </div>
  <canvas id="chart"></canvas>
</section>

</div>
</div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script>
(async () => {
const id = {{ .W.ID }};
const isTrainer = {{ .W.Trainer }};
const ftp = {{ .W.FTP }};

const data = await (await fetch(`/api/workout/${id}/samples`)).json();

const css = getComputedStyle(document.documentElement);
const cssVar = n => css.getPropertyValue(n).trim();
// цвет+прозрачность: заливка area и полосы зон — 10–15% (TODO-UI §4.3)
function alpha(hex, a) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return hex;
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}
const zoneColors = [1, 2, 3, 4, 5, 6, 7].map(i => cssVar(`--zone-z${i}`));

const metrics = [
  { key: "Power",     label: "Мощность, Вт",    color: cssVar("--brand"),   has: s => s.Power > 0, fill: true },
  { key: "HR",        label: "Пульс, уд/мин",   color: cssVar("--danger"),  has: s => s.HR > 0, fill: true },
  { key: "Cadence",   label: "Каденс, об/мин",  color: cssVar("--zone-z2"), has: s => s.Cadence > 0, fill: true },
  { key: "SpeedMs",   label: "Скорость, км/ч",  color: cssVar("--outdoor"), has: s => s.SpeedMs > 0, conv: v => v * 3.6, skip: isTrainer, fill: true },
  { key: "AltitudeM", label: "Высота, м",       color: cssVar("--text-3"),  has: s => s.HasAlt, skip: isTrainer, fill: true },
].filter(m => !m.skip && data.some(m.has));

const hasDist = data.some(s => s.HasDist && s.DistanceM > 0);
let curMetric = metrics[0], curAxis = "time";
let chart = null;

// фоновые полосы зон по FTP и референсы NP/FTP — только для мощности
const zoneEdges = {{ json .ZoneEdges }};
const refNP = {{ .W.NormPower }}, refFTP = ftp;

const zoneBands = {
  id: "zoneBands",
  beforeDatasetsDraw(c) {
    if (curMetric.key !== "Power" || !zoneEdges) return;
    const { ctx, chartArea, scales: { y } } = c;
    if (!chartArea) return;
    ctx.save();
    for (let i = 0; i < zoneEdges.length; i++) {
      const lo = zoneEdges[i];
      const hi = i + 1 < zoneEdges.length ? zoneEdges[i + 1] : y.max;
      const yTop = Math.max(y.getPixelForValue(Math.min(hi, y.max)), chartArea.top);
      const yBot = Math.min(y.getPixelForValue(Math.max(lo, y.min)), chartArea.bottom);
      if (yBot <= yTop) continue;
      ctx.fillStyle = alpha(zoneColors[i], 0.10);
      ctx.fillRect(chartArea.left, yTop, chartArea.width, yBot - yTop);
    }
    ctx.restore();
  },
};

const refLines = {
  id: "refLines",
  afterDatasetsDraw(c) {
    if (curMetric.key !== "Power") return;
    const { ctx, chartArea, scales: { y } } = c;
    const lines = [];
    if (refNP > 0) lines.push({ v: refNP, label: `NP ${refNP}`, color: cssVar("--brand") });
    if (refFTP > 0) lines.push({ v: refFTP, label: `FTP ${refFTP}`, color: cssVar("--text-2") });
    if (!lines.length) return;
    ctx.save();
    ctx.setLineDash([5, 4]);
    ctx.font = "11px Inter, sans-serif";
    ctx.textBaseline = "bottom";
    lines.forEach(l => {
      if (l.v < y.min || l.v > y.max) return;
      const py = y.getPixelForValue(l.v);
      ctx.strokeStyle = l.color;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, py);
      ctx.lineTo(chartArea.right, py);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = l.color;
      ctx.fillText(l.label, chartArea.right - ctx.measureText(l.label).width - 4, py - 2);
      ctx.setLineDash([5, 4]);
    });
    ctx.restore();
  },
};

// скользящее среднее ~10 сек: режем пилу нулей при свободном ходе
const spacing = data.length > 1 ? (data[data.length-1].Offset - data[0].Offset) / (data.length - 1) : 1;
const win = Math.max(1, Math.min(25, Math.round(10 / Math.max(spacing, 0.1))));
function smooth(y) {
  const half = Math.floor(win / 2), out = new Array(y.length);
  for (let i = 0; i < y.length; i++) {
    // дропаут — разрыв: скользящее среднее не заполняет пропуск соседями
    if (y[i] == null) { out[i] = null; continue; }
    let sum = 0, n = 0;
    for (let j = Math.max(0, i - half); j <= Math.min(y.length - 1, i + half); j++) {
      if (y[j] != null) { sum += y[j]; n++; }
    }
    out[i] = n ? sum / n : null;
  }
  return out;
}

function btn(parent, text, active, onclick, cls) {
  const b = document.createElement("button");
  b.textContent = text;
  b.className = cls;
  if (active) b.classList.add("active");
  b.onclick = () => { onclick(); redraw(); };
  parent.appendChild(b);
  return b;
}

function redraw() {
  document.querySelectorAll("#metricBtns .tab").forEach((b, i) => b.classList.toggle("active", metrics[i] === curMetric));
  document.querySelectorAll("#axisBtns .axis-btn").forEach(b => b.classList.toggle("active", b.dataset.axis === curAxis));
  const x = curAxis === "km"
    ? data.map(s => s.HasDist ? +(s.DistanceM / 1000).toFixed(2) : null)
    : data.map(s => s.Offset);
  const y = smooth(data.map(s => {
    let v = s[curMetric.key];
    if (curMetric.conv) v = curMetric.conv(v);
    if (curMetric.key === "AltitudeM" && !s.HasAlt) return null;
    // дропаут поверметра — разрыв, а не ложный ноль
    if (curMetric.key === "Power" && !s.HasPwr) return null;
    // каденс: дропаут или «не кручу» — разрыв, а не провал
    if (curMetric.key === "Cadence" && (!s.HasCad || v === 0)) return null;
    return v;
  }));
  chart.data.labels = x;
  chart.data.datasets = [{
    label: curMetric.label, data: y, borderWidth: 1.5, pointRadius: 0,
    borderColor: curMetric.color, fill: !!curMetric.fill,
    backgroundColor: alpha(curMetric.color, 0.12), spanGaps: false, // дропауты — разрыв линии, а не перемычка
  }];
  chart.options.scales.x.ticks.callback = curAxis === "km"
    ? v => x[v] + " км"
    : v => Math.round(x[v] / 60) + " мин";
  chart.update();
}

if (metrics.length) {
  metrics.forEach(m => btn(document.getElementById("metricBtns"), m.label.split(",")[0], m === curMetric, () => curMetric = m, "tab"));
  if (hasDist) {
    btn(document.getElementById("axisBtns"), "время", true, () => curAxis = "time", "axis-btn").dataset.axis = "time";
    btn(document.getElementById("axisBtns"), "км", false, () => curAxis = "km", "axis-btn").dataset.axis = "km";
  }
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels: [], datasets: [] },
    options: {
      animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => curMetric.label.split(",")[0] + ": " + Math.round(c.raw) } } },
      scales: { x: { ticks: {} }, y: { position: "left" } },
    },
    plugins: [zoneBands, refLines],
  });
  redraw();
} else {
  document.getElementById("chart").style.display = "none";
  document.getElementById("chartCtl").style.display = "none";
}
})();
</script>
{{ template "foot" . }}

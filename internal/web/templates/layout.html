{{ define "head" }}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycling Dashboard</title>
<script src="https://unpkg.com/htmx.org@2"></script>
<style>
  :root { --bg:#f6f8fa; --panel:#ffffff; --border:#d0d7de; --text:#1f2328; --dim:#59636e; --acc:#0969da; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width:920px; margin:0 auto; padding:20px; }
  main.wide { max-width:1440px; }
  h1 { font-size:24px; } h2 { font-size:19px; }
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  details { margin:8px 0; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
  summary { padding:12px 16px; cursor:pointer; font-weight:600; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; color:var(--dim); }
  details[open] > summary::before { content:"▾ "; }
  .months { margin:0 8px 8px; }
  .ride { display:flex; gap:14px; padding:8px 14px; border-top:1px solid var(--border); flex-wrap:wrap; font-size:15px; }
  .ride .sub { color:var(--dim); }
  .stats { display:flex; gap:16px; flex-wrap:wrap; margin:14px 0; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 18px; min-width:120px; }
  .stat .v { font-size:22px; font-weight:600; }
  .stat .k { color:var(--dim); font-size:13px; }
  .stat-groups h3 { margin:18px 0 0; font-size:15px; }
  .stat-groups .stats { margin:8px 0 0; }
  table { border-collapse:collapse; margin:12px 0; }
  td, th { padding:4px 14px 4px 0; text-align:left; }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  #chart { width:100%; height:280px; background:var(--panel); border:1px solid var(--border); border-radius:8px; }
  #map { width:100%; height:340px; border-radius:8px; margin-top:12px; border:1px solid var(--border); }
  .tag { font-size:12px; border:1px solid var(--border); border-radius:10px; padding:1px 8px; color:var(--dim); }
  .tag.warn { color:#9a6700; border-color:#d4a72c; background:#fff8c5; cursor:help; }
  .tag.pr { color:#1a7f37; border-color:#2da44e; background:#dafbe1; }
  .advice-list { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
  .advice { display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--dim); border-radius:8px; padding:10px 14px; }
  .advice .icon { display:inline-flex; align-items:center; justify-content:center; flex:0 0 20px; width:20px; height:20px; border-radius:50%; font-size:12px; font-weight:700; color:#fff; background:var(--dim); }
  .advice .t { font-weight:600; }
  .advice .x { color:var(--dim); font-size:14px; }
  .advice.warn { border-left-color:#d4a72c; } .advice.warn .icon { background:#d4a72c; }
  .advice.info { border-left-color:#0969da; } .advice.info .icon { background:#0969da; }
  .advice.good { border-left-color:#2da44e; } .advice.good .icon { background:#2da44e; }
  .dist-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
  .dist { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 16px; }
  .dist h3 { margin:0 0 8px; font-size:15px; }
  .dist-note { margin-top:6px; font-size:13px; color:var(--dim); }
  .heatmap { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 12px); gap:2px; overflow-x:auto; padding:4px 0; }
  .hm { display:inline-block; width:12px; height:12px; border-radius:2px; background:#ebedf0; }
  .hm.lvl1 { background:#9be9a8; } .hm.lvl2 { background:#40c463; } .hm.lvl3 { background:#30a14e; } .hm.lvl4 { background:#216e39; }
  .hm.today { outline:2px solid var(--acc); outline-offset:1px; }
  .hm-legend { display:flex; flex-wrap:wrap; gap:4px; align-items:center; color:var(--dim); font-size:13px; margin-top:8px; }
  .weeks { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  .week-row { display:flex; gap:10px; align-items:center; font-size:14px; flex-wrap:wrap; }
  .week-row .wk { width:52px; color:var(--dim); }
  .week-row .wk-num { width:72px; color:var(--dim); }
  .zbar { display:flex; flex:1 1 160px; max-width:220px; min-width:120px; height:10px; background:#ebedf0; border-radius:4px; overflow:hidden; }
  .zbar i { display:block; height:100%; }
  .zlow { background:#2da44e; } .zgray { background:#8c959f; } .zhigh { background:#cf222e; }
  .hm-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:2px; }
  .hm.future { background:transparent; outline:1px dashed var(--border); outline-offset:-1px; }
  .pol-good { color:#1a7f37 !important; } .pol-dim { color:var(--dim) !important; }
  .chart-controls { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin:0 0 -1px 0; padding:0 4px; position:relative; z-index:1; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  button.tab { font-size:14px; background:transparent; color:var(--dim); border:1px solid transparent; border-bottom:1px solid var(--border); border-radius:6px 6px 0 0; padding:6px 12px; cursor:pointer; }
  button.tab:hover { background:var(--bg); color:var(--text); }
  button.tab.active { background:var(--panel); color:var(--text); border-color:var(--border); border-bottom-color:var(--panel); font-weight:600; }
  .axis-toggles { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
  button.axis-btn { font-size:13px; background:var(--panel); color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button.axis-btn:hover { background:var(--bg); color:var(--text); }
  button.axis-btn.active { background:var(--bg); color:var(--text); border-color:var(--border); font-weight:600; }
  button { font:14px inherit; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 12px; cursor:pointer; }
  button:hover { background:var(--bg); }

  .nav { display:flex; gap:4px; flex-wrap:wrap; margin:0 0 16px; font-size:15px; }
  .nav a { padding:5px 11px; border-radius:6px; color:var(--dim); }
  .nav a + a::before { content:"· "; color:var(--border); }
  .nav a:hover { background:var(--panel); color:var(--text); text-decoration:none; }
  .today { display:flex; flex-direction:column; gap:14px; }
  .statusbar { display:grid; grid-template-columns:auto auto 1fr; gap:8px 20px; align-items:center;
    background:var(--panel); border:1px solid var(--border); border-left:6px solid var(--acc);
    border-radius:10px; padding:12px 20px; }
  .statusbar .d { color:var(--dim); font-size:14px; }
  .statusbar .label { font-size:30px; font-weight:700; line-height:1.1; }
  .statusbar .summary { color:var(--dim); font-size:15px; }
  .statusbar.label-fresh { border-left-color:#2da44e; }
  .statusbar.label-norm { border-left-color:#0969da; }
  .statusbar.label-loaded { border-left-color:#d4a72c; }
  .statusbar.label-overloaded { border-left-color:#cf222e; }
  .statusbar.label-lowdata { border-left-color:#8c959f; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 18px; }
  .panel h2 { margin:0 0 8px; font-size:16px; }
  .kicker { color:var(--dim); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .rec h2 { margin:2px 0 0; font-size:24px; }
  .rec-head { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .rec-facts { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; font-size:17px; }
  .rec-facts .w { font-size:20px; }
  .rec-why { margin:10px 0 0; font-size:15px; }
  .rec-details { margin:6px 0 0; border:0; background:transparent; }
  .rec-details > summary { padding:6px 0; font-weight:600; }
  .factors { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:4px 20px;
    margin:6px 0 0; padding:0; list-style:none; }
  .factors li { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed var(--border); padding:3px 0; }
  .factors li span { color:var(--dim); }
  .muted { color:var(--dim); }
  .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .metric { display:flex; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px; }
  .metric .k { color:var(--dim); font-size:13px; }
  .metric .v { font-size:30px; font-weight:700; line-height:1.15; }
  .metric .verdict { font-weight:700; }
  .metric .action { color:var(--dim); font-size:13px; }
  .metric .note { color:#9a6700; font-size:12px; }
  .spark { width:100%; height:30px; margin-top:2px; }
  .spark polyline { fill:none; stroke:var(--acc); stroke-width:2; vector-effect:non-scaling-stroke; }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:14px; }
  .grid2.equal { grid-template-columns:1fr 1fr; }
  .facts { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:14px; color:var(--dim); }
  .facts b { color:var(--text); font-weight:600; }
  .week-top { display:flex; align-items:baseline; gap:8px; font-size:20px; }
  .week-top b { font-size:28px; }
  .bar { height:10px; background:#ebedf0; border-radius:5px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; }
  .bar i.green { background:#2da44e; } .bar i.yellow { background:#d4a72c; } .bar i.red { background:#cf222e; }
  .week-line { font-size:14px; color:var(--dim); margin-top:2px; }
  .mini { border-left:3px solid var(--dim); padding:3px 0 3px 10px; font-size:14px; margin-top:6px; }
  .mini.warn { border-left-color:#d4a72c; } .mini.info { border-left-color:#0969da; } .mini.good { border-left-color:#2da44e; }
  .alert { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--border); font-size:14px; }
  .alert:first-of-type { border-top:0; }
  .alert .badge { flex:0 0 auto; font-size:11px; border-radius:10px; padding:1px 7px; color:#fff; background:var(--dim); }
  .alert.warn .badge { background:#d4a72c; } .alert.info .badge { background:#0969da; }
  .empty { color:var(--dim); font-size:14px; }
  .alerts details { margin:6px 0 0; }
  .alerts details summary { padding:6px 0; font-size:14px; }
  @media (max-width:1000px) {
    .cards, .grid2, .grid2.equal { grid-template-columns:1fr; }
    .statusbar { grid-template-columns:1fr; gap:4px; }
  }
</style>
</head>
<body>
<main{{ if .Wide }} class="wide"{{ end }}>
<nav class="nav">
  <a href="/">Сегодня</a>
  <a href="/rides">Поездки</a>
  <a href="/progress">Прогресс</a>
  <a href="/profile">Профиль</a>
</nav>
{{ end }}

{{ define "foot" }}
</main>
</body>
</html>
{{ end }}

{{ define "ftpUpdate" }}
<button hx-post="/profile/entry" hx-swap="none"
  hx-vals='{"kind":"{{ if eq .Kind "outdoor" }}ftp_outdoor{{ else }}ftp{{ end }}","value":"{{ trimFloat .Estimate }}","workoutId":{{ .WorkoutID }}}'>Обновить FTP</button>
{{ end }}
